            <script>
              var secretnumber = [7]
var guess = prompt("What's your favorite number?");
guess = parseInt(guess);
while(isNaN(guess)){
	guess = prompt("That's not a number! What's your favorite number?");
	guess = parseInt(guess);
}
if(guess === secretnumber[0]){
	document.write("Congratulations! You guessed the secret number and earned 10 points.");
} else {
	document.write("Sorry, better luck next time. You've earned 0 points.");
}
              </script>
